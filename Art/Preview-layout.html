:root{--veil:#171C26;--inkPrimary:#F2ECE1;--inkSecondary:#9BBBEF;--accent:#AD78FF;--badgeInk:#17120E;--iconOutline:var(--accent)}*{margin:0;padding:0;box-sizing:border-box}
html,body{width:896px;height:504px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}

body{background:url(Preview.png) center/cover}
@property --lueur{syntax:'<percentage>';inherits:false;initial-value:24%}
